[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skillontology"
version = "0.1.0"
description = "Ontology-guided skill composition"
requires-python = ">=3.10,<3.13"
dependencies = ["numpy>=1.26,<3", "PyYAML>=6,<7", "tqdm>=4.66,<5", "openai>=1,<2", "httpx>=0.27,<1", "json-repair>=0.39,<1"]

[project.optional-dependencies]
alfworld = ["alfworld>=0.4.2"]
scienceworld = ["scienceworld==1.2.3"]

[project.scripts]
skillontology = "skillontology.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["skillontology*"]
